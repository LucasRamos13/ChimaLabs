[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.100"
publish = false
repository = "https://github.com/LucasRamos13/ChimaLabs"

[workspace.lints.rust]
unsafe_code = "deny"            # exceções por crate devem ser justificadas em DECISOES_TECNICAS.md
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Testes e desenvolvimento: só tabelas de linhas (backtraces com arquivo:linha) e dependências
# sem depuração. Reduz o tamanho dos binários de teste e a memória do ligador.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1

# Usado só pelo teste de mutação (cargo mutants --profile=mutants): sem informação de
# depuração, para compilar e ligar mais rápido cada mutante.
[profile.mutants]
inherits = "test"
debug = "none"
